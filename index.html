<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Yurii & Olena</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f4efe7;
    }

    body {
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    body.site-open {
      overflow-x: hidden;
      overflow-y: auto;
    }

    button {
      font: inherit;
    }

    /* =========================
       ФОТОГРАФИИ
    ========================= */

    #gallery {
      position: relative;
      z-index: 1;
      width: 100%;
      opacity: 0;
      background: #f4efe7;
      transition: opacity 1.5s ease;
    }

    #gallery.show {
      opacity: 1;
    }

    .photo-section {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      overflow: hidden;
      background: #f4efe7;
    }

    .photo-section img {
      display: block;

      width: 100%;
      height: auto;
      max-height: 100vh;
      max-height: 100svh;

      object-fit: contain;
      object-position: center;

      opacity: 0;
      filter: blur(8px);
      transform: translateY(55px) scale(0.98);

      transition:
        opacity 1.4s ease,
        filter 1.4s ease,
        transform 1.6s cubic-bezier(0.22, 0.8, 0.24, 1);
    }

    .photo-section.visible img {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0) scale(1);
    }
    /* Foto4 появляется с правой стороны */
.photo-section.from-right img {
  opacity: 0;
  filter: blur(8px);
  transform: translateX(120px) scale(0.97);
}

.photo-section.from-right.visible img {
  opacity: 1;
  filter: blur(0);
  transform: translateX(0) scale(1);
}

    /* =========================
       НАЧАЛЬНОЕ ВИДЕО
    ========================= */

    #videoScreen {
      position: fixed;
      inset: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;
      background: #071b15;

      opacity: 1;
      filter: blur(0);
      transform: scale(1);

      transition:
        opacity 1.4s ease,
        filter 1.4s ease,
        transform 1.5s ease;
    }

    #videoScreen.disappear {
      pointer-events: none;
      opacity: 0;
      filter: blur(12px);
      transform: scale(1.04);
    }

    #backgroundVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;
    }

    .video-shadow {
      position: absolute;
      inset: 0;

      pointer-events: none;
      opacity: 0;

      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(3, 18, 13, 0.7) 100%
      );

      transition: opacity 0.8s ease;
    }

    #videoScreen.finished .video-shadow {
      opacity: 1;
    }

    /* =========================
       КНОПКА ОТКРЫТИЯ
    ========================= */

    #openButton {
      position: absolute;
      left: 50%;
      bottom: max(
        42px,
        calc(env(safe-area-inset-bottom) + 24px)
      );
      z-index: 12;

      min-width: min(82vw, 330px);
      min-height: 54px;
      padding: 13px 25px;

      border: 1px solid rgba(255, 250, 240, 0.75);
      border-radius: 50px;

      color: #fffaf0;
      background: rgba(7, 27, 21, 0.65);

      font-size: 17px;
      letter-spacing: 0.04em;

      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.32);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      cursor: pointer;

      opacity: 0;
      transform: translateX(-50%) translateY(18px);

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    #openButton.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #openButton[hidden] {
      display: none;
    }

    /* =========================
       КНОПКА МУЗЫКИ
    ========================= */

    #musicButton {
      position: fixed;
      right: max(
        18px,
        env(safe-area-inset-right)
      );
      bottom: max(
        20px,
        calc(env(safe-area-inset-bottom) + 12px)
      );
      z-index: 20;

      width: 52px;
      height: 52px;

      border: 1px solid rgba(255, 250, 240, 0.65);
      border-radius: 50%;

      color: #fffaf0;
      background: rgba(7, 27, 21, 0.7);

      font-size: 25px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      cursor: pointer;

      opacity: 0;
      transform: scale(0.7);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;
    }

    #musicButton.show {
      opacity: 1;
      transform: scale(1);
    }

    #musicButton[hidden] {
      display: none;
    }

    #musicButton.playing {
      animation: music-pulse 2s ease-in-out infinite;
    }

    @keyframes music-pulse {
      0%,
      100% {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      50% {
        box-shadow:
          0 10px 35px rgba(0, 0, 0, 0.35),
          0 0 0 8px rgba(203, 185, 135, 0.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #gallery,
      #videoScreen,
      .photo-section img,
      #openButton,
      #musicButton {
        transition-duration: 0.01ms;
        animation: none;
      }
    }
    /* Фотографии соединяются без зазоров */
.photo-section {
  display: block;
  width: 100%;
  min-height: 0;
  margin: -1px 0 0;
  padding: 0;
  overflow: hidden;
  line-height: 0;
}

.photo-section:first-child {
  margin-top: 0;
}

.photo-section img {
  display: block;
  width: 100%;
  height: auto;
  max-height: none;
  margin: 0;
  vertical-align: top;
}

/* Расписание свадебного дня */
.timeline-section {
  position: relative;
  display: block;
  width: 100%;
  min-height: 0;
  margin: -1px 0 0;
  padding: 0;
  overflow: hidden;
  line-height: normal;
}

/* Сама фотография остаётся неподвижной */
.timeline-section .timeline-background {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  opacity: 1 !important;
  filter: none !important;
  transform: none !important;
  clip-path: none !important;
  transition: none !important;
}

/* Общий вид надписей */
.timeline-event {
  position: absolute;
  z-index: 5;
  text-align: center;
  color: #504f2c;
  pointer-events: none;
  opacity: 0;
  transition:
    opacity 1.1s ease,
    transform 1.1s cubic-bezier(0.22, 0.8, 0.24, 1);
}

.event-title {
  font-family: "Marck Script", cursive;
  font-size: clamp(28px, 7.2vw, 68px);
  font-weight: 400;
  line-height: 1;
  white-space: nowrap;
}

.event-time {
  margin-top: 0.35em;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(21px, 5.2vw, 48px);
  font-weight: 500;
  line-height: 1;
}

/* Точные места надписей */
.event-1 {
  top: 3.4%;
  left: 38%;
  width: 40%;
}

.event-2 {
  top: 20.5%;
  left: 31%;
  width: 46%;
}

.event-3 {
  top: 35.4%;
  left: 34%;
  width: 42%;
}

.event-4 {
  top: 50.7%;
  left: 30%;
  width: 48%;
}

.event-5 {
  top: 64.8%;
  left: 32%;
  width: 51%;
}

/* Направление появления */
.timeline-event.enter-right {
  transform: translateX(100px);
}

.timeline-event.enter-left {
  transform: translateX(-100px);
}

/* Конечное положение */
.timeline-event.timeline-visible {
  opacity: 1;
  transform: translateX(0);
}

@media (prefers-reduced-motion: reduce) {
  .timeline-event {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

/* Кнопка Google Maps на Foto5 */
.location-section {
  position: relative;
}

.location-link {
  position: absolute;
  left: 22.8%;
  top: 70%;
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 54.4%;
  height: 6.8%;
  padding: 0 3%;
  border-radius: 999px;
  color: #3f4727;
  background: rgba(250, 247, 239, 0.5);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(14px, 3.7vw, 34px);
  line-height: 1.15;
  letter-spacing: 0.02em;
  text-align: center;
  text-decoration: none;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 1s ease 0.35s, transform 1s ease 0.35s, background 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}

.location-section.visible .location-link {
  opacity: 1;
  transform: translateY(0);
}

.location-link:active {
  background: rgba(231, 221, 194, 0.82);
}
  </style>
</head>

<body>

  <!-- Фотографии сайта -->
  <main id="gallery" aria-hidden="true">

    <section class="photo-section visible">
      <img
        src="Foto1.PNG"
        alt="Yurii та Olena — перша фотографія"
      >
    </section>

    <section class="photo-section">
      <img
        src="Foto2.PNG"
        alt="Yurii та Olena — друга фотографія"
        loading="lazy"
      >
    </section>

    <section class="photo-section">
      <img
        src="Foto3.PNG"
        alt="Yurii та Olena — третя фотографія"
        loading="lazy"
      >
    </section>
    
<section
  class="timeline-section notranslate"
  id="timelineSection"
  translate="no"
>
  <img
    src="Foto4.PNG?v=7"
    class="timeline-background"
    alt="Розклад весільного дня"
    width="941"
    height="1672"
    loading="eager"
    decoding="async"
    translate="no"
  >

  <div class="timeline-event event-1 enter-right">
    <div class="event-title">Вінчання</div>
    <div class="event-time">11:00</div>
  </div>

  <div class="timeline-event event-2 enter-left">
    <div class="event-title">Обід</div>
    <div class="event-time">13:30</div>
  </div>

  <div class="timeline-event event-3 enter-right">
    <div class="event-title">Перерва</div>
    <div class="event-time">16:00</div>
  </div>

  <div class="timeline-event event-4 enter-left">
    <div class="event-title">Вечеря</div>
    <div class="event-time">17:00</div>
  </div>

  <div class="timeline-event event-5 enter-right">
    <div class="event-title">Закінчення</div>
    <div class="event-time">19:00</div>
  </div>
</section>

    <section class="photo-section location-section">
      <img
        src="Foto5.PNG?v=1"
        alt="Місце проведення — FECG Cloppenburg West"
        loading="lazy"
      >

      <a
        class="location-link"
        href="https://www.google.com/maps/search/?api=1&amp;query=FECG%20Cloppenburg%20West%2C%20Huntestra%C3%9Fe%2039%2C%2049661%20Cloppenburg"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Відкрити місце проведення в Google Maps"
      >
        Відкрити в Google Maps
      </a>
    </section>

  </main>

  <!-- Начальный экран с видео -->
  <section id="videoScreen">

    <video
      id="backgroundVideo"
      autoplay
      muted
      playsinline
      preload="auto"
    >
      <source src="Fon.MOV" type="video/quicktime">
    </video>

    <div class="video-shadow"></div>

    <button id="openButton" type="button" hidden>
      Відкрити запрошення
    </button>

  </section>

  <!-- Фоновая музыка -->
  <audio id="backgroundMusic" loop preload="auto">
  <source src="Music%20.mp3" type="audio/mpeg">
  </audio>

  <!-- Включение и выключение музыки -->
  <button
    id="musicButton"
    type="button"
    aria-label="Вимкнути музику"
    hidden
  >
    ♫
  </button>

  <script>
    const video = document.getElementById("backgroundVideo");
    const videoScreen = document.getElementById("videoScreen");
    const openButton = document.getElementById("openButton");

    const gallery = document.getElementById("gallery");
    const photoSections = document.querySelectorAll(".photo-section");

    const music = document.getElementById("backgroundMusic");
    const musicButton = document.getElementById("musicButton");

    let screenMode = "video";
    let musicFadeTimer;

    /* На iPhone Safari всегда начинаем с первой фотографии */
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    window.scrollTo(0, 0);

    window.addEventListener("pageshow", function () {
      window.scrollTo(0, 0);
    });

    /* Видео всегда без звука */
    video.muted = true;
    video.defaultMuted = true;
    video.volume = 0;

    /* Когда видео закончилось */
    video.addEventListener("ended", function () {
      screenMode = "finished";

      videoScreen.classList.add("finished");

      openButton.textContent = "Відкрити запрошення";
      openButton.hidden = false;

      requestAnimationFrame(function () {
        openButton.classList.add("show");
      });
    });

    /* Плавное включение музыки */
    function startMusic() {
      clearInterval(musicFadeTimer);

      music.volume = 0;

      music.play().then(function () {
        musicButton.hidden = false;
        musicButton.classList.add("show", "playing");
        musicButton.textContent = "♫";
        musicButton.setAttribute(
          "aria-label",
          "Вимкнути музику"
        );

        let volume = 0;

        musicFadeTimer = setInterval(function () {
          volume += 0.05;

          music.volume = Math.min(volume, 0.65);

          if (volume >= 0.65) {
            clearInterval(musicFadeTimer);
          }
        }, 120);
      }).catch(function () {
        /* Если музыка не включилась,
           её можно запустить кнопкой ♫ */
        musicButton.hidden = false;
        musicButton.classList.add("show");
      });
    }

    /* Открытие приглашения */
    function openInvitation() {
      if (screenMode !== "finished") {
        return;
      }

      screenMode = "opening";

      openButton.classList.remove("show");

      document.body.classList.add("site-open");

      gallery.setAttribute("aria-hidden", "false");
      gallery.classList.add("show");

      videoScreen.classList.add("disappear");

      startMusic();

      window.scrollTo(0, 0);

      requestAnimationFrame(function () {
        window.scrollTo(0, 0);
      });

      setTimeout(function () {
        videoScreen.style.display = "none";
        window.scrollTo(0, 0);
      }, 1500);
    }

    /* Нажатие на кнопку открытия */
    openButton.addEventListener("click", function (event) {
      event.stopPropagation();

      if (screenMode === "start") {
        video.play().then(function () {
          screenMode = "video";
          openButton.classList.remove("show");

          setTimeout(function () {
            openButton.hidden = true;
          }, 700);
        });

        return;
      }

      openInvitation();
    });

    /* После окончания видео можно нажать
       в любое место экрана */
    videoScreen.addEventListener("click", function () {
      if (screenMode === "finished") {
        openInvitation();
      }
    });

    /* Если телефон не разрешил автозапуск */
    window.addEventListener("load", function () {
      video.play().catch(function () {
        screenMode = "start";

        openButton.textContent = "Запустити відео";
        openButton.hidden = false;
        openButton.classList.add("show");
      });
    });

    /* Включение и выключение музыки */
    musicButton.addEventListener("click", function () {
      if (music.paused) {
        music.play();

        musicButton.textContent = "♫";
        musicButton.classList.add("playing");
        musicButton.setAttribute(
          "aria-label",
          "Вимкнути музику"
        );
      } else {
        music.pause();

        musicButton.textContent = "♪";
        musicButton.classList.remove("playing");
        musicButton.setAttribute(
          "aria-label",
          "Увімкнути музику"
        );
      }
    });

    /* Анимация фотографий во время прокрутки */
    const photoObserver = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      },
      {
        threshold: 0.2
      }
    );

    photoSections.forEach(function (section) {
      photoObserver.observe(section);
    });
    const timelineEvents = document.querySelectorAll(".timeline-event");

const timelineTextObserver = new IntersectionObserver(
  (entries, observer) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add("timeline-visible");
        observer.unobserve(entry.target);
      }
    });
  },
  {
    threshold: 0.35
  }
);

timelineEvents.forEach((event) => {
  timelineTextObserver.observe(event);
});
  </script>


</body>
</html>
