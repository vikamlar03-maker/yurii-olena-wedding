<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Yurii & Olena</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #f4efe7;
    }

    body {
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    body.site-open {
      overflow-x: hidden;
      overflow-y: auto;
    }

    button {
      font: inherit;
    }

    /* =========================
       ФОТОГРАФИИ
    ========================= */

    #gallery {
      position: relative;
      z-index: 1;
      width: 100%;
      opacity: 0;
      background: #f4efe7;
      transition: opacity 1.5s ease;
    }

    #gallery.show {
      opacity: 1;
    }

    .photo-section {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      overflow: hidden;
      background: #f4efe7;
    }

    .photo-section img {
      display: block;

      width: 100%;
      height: auto;
      max-height: 100vh;
      max-height: 100svh;

      object-fit: contain;
      object-position: center;

      opacity: 0;
      filter: blur(8px);
      transform: translateY(55px) scale(0.98);

      transition:
        opacity 1.4s ease,
        filter 1.4s ease,
        transform 1.6s cubic-bezier(0.22, 0.8, 0.24, 1);
    }

    .photo-section.visible img {
      opacity: 1;
      filter: blur(0);
      transform: translateY(0) scale(1);
    }
    /* Foto4 появляется с правой стороны */
.photo-section.from-right img {
  opacity: 0;
  filter: blur(8px);
  transform: translateX(120px) scale(0.97);
}

.photo-section.from-right.visible img {
  opacity: 1;
  filter: blur(0);
  transform: translateX(0) scale(1);
}

    /* =========================
       НАЧАЛЬНОЕ ВИДЕО
    ========================= */

    #videoScreen {
      position: fixed;
      inset: 0;
      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;
      background: #071b15;

      opacity: 1;
      filter: blur(0);
      transform: scale(1);

      transition:
        opacity 1.4s ease,
        filter 1.4s ease,
        transform 1.5s ease;
    }

    #videoScreen.disappear {
      pointer-events: none;
      opacity: 0;
      filter: blur(12px);
      transform: scale(1.04);
    }

    #backgroundVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;
    }

    .video-shadow {
      position: absolute;
      inset: 0;

      pointer-events: none;
      opacity: 0;

      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(3, 18, 13, 0.7) 100%
      );

      transition: opacity 0.8s ease;
    }

    #videoScreen.finished .video-shadow {
      opacity: 1;
    }

    /* =========================
       КНОПКА ОТКРЫТИЯ
    ========================= */

    #openButton {
      position: absolute;
      left: 50%;
      bottom: max(
        42px,
        calc(env(safe-area-inset-bottom) + 24px)
      );
      z-index: 12;

      min-width: min(82vw, 330px);
      min-height: 54px;
      padding: 13px 25px;

      border: 1px solid rgba(255, 250, 240, 0.75);
      border-radius: 50px;

      color: #fffaf0;
      background: rgba(7, 27, 21, 0.65);

      font-size: 17px;
      letter-spacing: 0.04em;

      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.32);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      cursor: pointer;

      opacity: 0;
      transform: translateX(-50%) translateY(18px);

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    #openButton.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #openButton[hidden] {
      display: none;
    }

    /* =========================
       КНОПКА МУЗЫКИ
    ========================= */

    #musicButton {
      position: fixed;
      right: max(
        18px,
        env(safe-area-inset-right)
      );
      bottom: max(
        20px,
        calc(env(safe-area-inset-bottom) + 12px)
      );
      z-index: 20;

      width: 52px;
      height: 52px;

      border: 1px solid rgba(255, 250, 240, 0.65);
      border-radius: 50%;

      color: #fffaf0;
      background: rgba(7, 27, 21, 0.7);

      font-size: 25px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      cursor: pointer;

      opacity: 0;
      transform: scale(0.7);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;
    }

    #musicButton.show {
      opacity: 1;
      transform: scale(1);
    }

    #musicButton[hidden] {
      display: none;
    }

    #musicButton.playing {
      animation: music-pulse 2s ease-in-out infinite;
    }

    @keyframes music-pulse {
      0%,
      100% {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      50% {
        box-shadow:
          0 10px 35px rgba(0, 0, 0, 0.35),
          0 0 0 8px rgba(203, 185, 135, 0.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #gallery,
      #videoScreen,
      .photo-section img,
      #openButton,
      #musicButton {
        transition-duration: 0.01ms;
        animation: none;
      }
    }
    /* Фотографии соединяются без зазоров */
.photo-section {
  display: block;
  width: 100%;
  min-height: 0;
  margin: -1px 0 0;
  padding: 0;
  overflow: hidden;
  line-height: 0;
}

.photo-section:first-child {
  margin-top: 0;
}

.photo-section img {
  display: block;
  width: 100%;
  height: auto;
  max-height: none;
  margin: 0;
  vertical-align: top;
}

/* Расписание свадебного дня */
.timeline-section {
  position: relative;
  display: block;
  width: 100%;
  min-height: 0;
  margin: -1px 0 0;
  padding: 0;
  overflow: hidden;
  line-height: normal;
  opacity: 0;
  transform: translateY(34px);
  transition:
    opacity 1.15s ease,
    transform 1.35s cubic-bezier(0.22, 0.8, 0.24, 1);
}

.timeline-section.timeline-photo-visible {
  opacity: 1;
  transform: translateY(0);
}

/* Сама фотография остаётся неподвижной */
.timeline-section .timeline-background {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  opacity: 1 !important;
  filter: none !important;
  transform: none !important;
  clip-path: none !important;
  transition: none !important;
}

/* Общий вид надписей */
.timeline-event {
  position: absolute;
  z-index: 5;
  text-align: center;
  color: #504f2c;
  pointer-events: none;
  opacity: 0;
  transition:
    opacity 1.1s ease,
    transform 1.1s cubic-bezier(0.22, 0.8, 0.24, 1);
}

.event-title {
  font-family: "Marck Script", cursive;
  font-size: clamp(28px, 7.2vw, 68px);
  font-weight: 400;
  line-height: 1;
  white-space: nowrap;
}

.event-time {
  margin-top: 0.35em;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(21px, 5.2vw, 48px);
  font-weight: 500;
  line-height: 1;
}

/* Точные места надписей */
.event-1 {
  top: 3.4%;
  left: 38%;
  width: 40%;
}

.event-2 {
  top: 20.5%;
  left: 31%;
  width: 46%;
}

.event-3 {
  top: 35.4%;
  left: 34%;
  width: 42%;
}

.event-4 {
  top: 50.7%;
  left: 30%;
  width: 48%;
}

.event-5 {
  top: 64.8%;
  left: 32%;
  width: 51%;
}

/* Направление появления */
.timeline-event.enter-right {
  transform: translateX(100px);
}

.timeline-event.enter-left {
  transform: translateX(-100px);
}

/* Конечное положение */
.timeline-event.timeline-visible {
  opacity: 1;
  transform: translateX(0);
}

@media (prefers-reduced-motion: reduce) {
  .timeline-section,
  .timeline-event {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

/* Кнопка Google Maps на Foto5 */
.location-section {
  position: relative;
}

.location-link {
  position: absolute;
  left: 22.8%;
  top: 70%;
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 54.4%;
  height: 6.8%;
  padding: 0 3%;
  border-radius: 999px;
  color: #3f4727;
  background: rgba(250, 247, 239, 0.5);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(14px, 3.7vw, 34px);
  line-height: 1.15;
  letter-spacing: 0.02em;
  text-align: center;
  text-decoration: none;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 1s ease 0.35s, transform 1s ease 0.35s, background 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}

.location-section.visible .location-link {
  opacity: 1;
  transform: translateY(0);
}

.location-link:active {
  background: rgba(231, 221, 194, 0.82);
}

/* Горизонтальная галерея на бумажном фоне */
.memory-gallery {
  position: relative;
  width: 100%;
  margin: -1px 0 0;
  padding: clamp(28px, 6vw, 58px) 0 clamp(54px, 12vw, 118px);
  overflow: hidden;
  background:
    radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.48), transparent 34%),
    radial-gradient(circle at 84% 78%, rgba(211, 194, 151, 0.12), transparent 38%),
    #f4efe7;
}

.memory-gallery__track {
  display: flex;
  gap: clamp(14px, 3.2vw, 28px);
  width: 100%;
  margin: 0;
  padding: 0 12vw 14px 3vw;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-padding-left: 3vw;
  overscroll-behavior-inline: contain;
  touch-action: pan-x pan-y;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.memory-gallery__track::-webkit-scrollbar {
  display: none;
}

.memory-gallery__slide {
  flex: 0 0 min(80vw, 640px);
  aspect-ratio: 3 / 4;
  margin: 0;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: clamp(22px, 5.5vw, 48px);
  background: #e9e2d7;
  box-shadow: 0 16px 38px rgba(35, 50, 40, 0.14);
  scroll-snap-align: start;
  scroll-snap-stop: always;
}

.memory-gallery__slide img {
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
  object-fit: cover;
  object-position: center;
}

.memory-gallery__track:focus-visible {
  outline: 2px solid rgba(63, 71, 39, 0.65);
  outline-offset: -2px;
}

/* =========================
   ТАЙМЕР И АНКЕТА ГОСТЯ
========================= */

.final-section {
  width: 100%;
  margin: -1px 0 0;
  padding: 0 0 max(58px, calc(env(safe-area-inset-bottom) + 36px));
  overflow: hidden;
  color: #34402b;
  background:
    radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.5), transparent 34%),
    radial-gradient(circle at 86% 78%, rgba(211, 194, 151, 0.12), transparent 40%),
    #f4efe7;
  font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
}

.countdown-card {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  min-height: 390px;
  overflow: hidden;
  background: #d9ddd8;
}

.countdown-photo {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 35%;
  filter: brightness(0.82) saturate(0.9);
}

.countdown-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(244, 239, 231, 0.22),
    rgba(17, 31, 24, 0.18) 58%,
    rgba(17, 31, 24, 0.42)
  );
}

.countdown-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  height: 100%;
  padding: clamp(32px, 8vw, 74px) 5vw clamp(28px, 7vw, 62px);
  color: #fffaf0;
  text-align: center;
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.42);
}

.countdown-title {
  max-width: 900px;
  margin: 0;
  font-size: clamp(28px, 6.2vw, 62px);
  font-weight: 500;
  line-height: 1.08;
}

.countdown-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  width: min(94%, 820px);
}

.countdown-item {
  position: relative;
  padding: 0 2vw;
}

.countdown-item + .countdown-item {
  border-left: 1px solid rgba(255, 250, 240, 0.68);
}

.countdown-number {
  display: block;
  font-size: clamp(32px, 9vw, 80px);
  font-variant-numeric: tabular-nums;
  line-height: 0.95;
}

.countdown-label {
  display: block;
  margin-top: 0.55em;
  font-size: clamp(12px, 3vw, 24px);
  letter-spacing: 0.06em;
}

.rsvp-wrap {
  width: min(92%, 760px);
  margin: 0 auto;
  padding: clamp(52px, 12vw, 110px) 0 0;
}

.rsvp-title,
.telegram-title {
  margin: 0;
  color: #34402b;
  font-size: clamp(42px, 10vw, 84px);
  font-weight: 600;
  line-height: 1;
  text-align: center;
}

.rsvp-form {
  margin-top: clamp(30px, 7vw, 58px);
  padding: clamp(28px, 7vw, 60px) clamp(22px, 6vw, 54px);
  border: 1px solid rgba(70, 82, 53, 0.16);
  border-radius: clamp(28px, 7vw, 54px);
  background: rgba(255, 253, 247, 0.7);
  box-shadow: 0 18px 50px rgba(45, 58, 42, 0.08);
}

.rsvp-field {
  width: 100%;
  min-height: 64px;
  padding: 14px 24px;
  border: 1.5px solid rgba(59, 72, 47, 0.36);
  border-radius: 999px;
  outline: none;
  color: #34402b;
  background: rgba(255, 255, 255, 0.66);
  font: inherit;
  font-size: clamp(21px, 5vw, 34px);
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

.rsvp-field::placeholder {
  color: rgba(52, 64, 43, 0.48);
}

.rsvp-field:focus {
  border-color: #52623f;
  box-shadow: 0 0 0 4px rgba(82, 98, 63, 0.1);
}

.attendance-fieldset {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(28px, 10vw, 82px);
  margin: clamp(28px, 7vw, 48px) 0;
  padding: 0;
  border: 0;
}

.attendance-option {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: #34402b;
  font-size: clamp(25px, 6vw, 42px);
  cursor: pointer;
}

.attendance-option input {
  width: 28px;
  height: 28px;
  margin: 0;
  accent-color: #34402b;
}

.rsvp-submit {
  display: block;
  min-width: min(78%, 360px);
  min-height: 62px;
  margin: clamp(28px, 7vw, 48px) auto 0;
  padding: 15px 30px;
  border: 0;
  border-radius: 999px;
  color: #fffaf0;
  background: #314738;
  font: inherit;
  font-size: clamp(23px, 5.6vw, 38px);
  font-weight: 600;
  box-shadow: 0 12px 28px rgba(49, 71, 56, 0.22);
  cursor: pointer;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.rsvp-submit:active {
  transform: scale(0.98);
}

.rsvp-submit:disabled {
  cursor: wait;
  opacity: 0.62;
}

.rsvp-status {
  min-height: 1.4em;
  margin: 22px 0 0;
  color: #52623f;
  font-size: clamp(18px, 4.4vw, 28px);
  line-height: 1.25;
  text-align: center;
}

.rsvp-success {
  margin-top: clamp(30px, 7vw, 58px);
  padding: clamp(42px, 10vw, 86px) 24px;
  border: 1px solid rgba(70, 82, 53, 0.16);
  border-radius: clamp(28px, 7vw, 54px);
  color: #34402b;
  background: rgba(255, 253, 247, 0.72);
  font-size: clamp(34px, 8vw, 68px);
  text-align: center;
}

.rsvp-success[hidden],
.honeypot-field {
  display: none;
}

.telegram-group {
  padding: clamp(58px, 13vw, 120px) 5vw 0;
  text-align: center;
}

.telegram-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 58px;
  margin-top: clamp(24px, 6vw, 46px);
  padding: 13px 30px;
  border: 1px solid rgba(52, 64, 43, 0.36);
  border-radius: 999px;
  color: #34402b;
  background: rgba(255, 253, 247, 0.6);
  font-size: clamp(22px, 5.3vw, 36px);
  text-decoration: none;
  box-shadow: 0 12px 28px rgba(45, 58, 42, 0.08);
}

@media (max-width: 430px) {
  .countdown-card {
    min-height: 360px;
  }

  .countdown-content {
    padding-inline: 3vw;
  }

  .countdown-item {
    padding-inline: 1.5vw;
  }
}

  </style>
</head>

  <!-- Включение и выключение музыки -->
  <button
    id="musicButton"
    type="button"
    aria-label="Вимкнути музику"
    hidden
  >
    ♫
  </button>

  <script>
    const video = document.getElementById("backgroundVideo");
    const videoScreen = document.getElementById("videoScreen");
    const openButton = document.getElementById("openButton");

    const gallery = document.getElementById("gallery");
    const photoSections = document.querySelectorAll(".photo-section");

    const music = document.getElementById("backgroundMusic");
    const musicButton = document.getElementById("musicButton");

    let screenMode = "video";
    let musicFadeTimer;

    /* На iPhone Safari всегда начинаем с первой фотографии */
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    window.scrollTo(0, 0);

    window.addEventListener("pageshow", function () {
      window.scrollTo(0, 0);
    });

    /* Видео всегда без звука */
    video.muted = true;
    video.defaultMuted = true;
    video.volume = 0;

    /* Когда видео закончилось */
    video.addEventListener("ended", function () {
      screenMode = "finished";

      videoScreen.classList.add("finished");

      openButton.textContent = "Відкрити запрошення";
      openButton.hidden = false;

      requestAnimationFrame(function () {
        openButton.classList.add("show");
      });
    });

    /* Плавное включение музыки */
    function startMusic() {
      clearInterval(musicFadeTimer);

      music.volume = 0;

      music.play().then(function () {
        musicButton.hidden = false;
        musicButton.classList.add("show", "playing");
        musicButton.textContent = "♫";
        musicButton.setAttribute(
          "aria-label",
          "Вимкнути музику"
        );

        let volume = 0;

        musicFadeTimer = setInterval(function () {
          volume += 0.05;

          music.volume = Math.min(volume, 0.65);

          if (volume >= 0.65) {
            clearInterval(musicFadeTimer);
          }
        }, 120);
      }).catch(function () {
        /* Если музыка не включилась,
           её можно запустить кнопкой ♫ */
        musicButton.hidden = false;
        musicButton.classList.add("show");
      });
    }

    /* Открытие приглашения */
    function openInvitation() {
      if (screenMode !== "finished") {
        return;
      }

      screenMode = "opening";

      openButton.classList.remove("show");

      document.body.classList.add("site-open");

      gallery.setAttribute("aria-hidden", "false");
      gallery.classList.add("show");

      videoScreen.classList.add("disappear");

      startMusic();

      window.scrollTo(0, 0);

      requestAnimationFrame(function () {
        window.scrollTo(0, 0);
      });

      setTimeout(function () {
        videoScreen.style.display = "none";
        window.scrollTo(0, 0);
      }, 1500);
    }

    /* Нажатие на кнопку открытия */
    openButton.addEventListener("click", function (event) {
      event.stopPropagation();

      if (screenMode === "start") {
        video.play().then(function () {
          screenMode = "video";
          openButton.classList.remove("show");

          setTimeout(function () {
            openButton.hidden = true;
          }, 700);
        });

        return;
      }

      openInvitation();
    });

    /* После окончания видео можно нажать
       в любое место экрана */
    videoScreen.addEventListener("click", function () {
      if (screenMode === "finished") {
        openInvitation();
      }
    });

    /* Если телефон не разрешил автозапуск */
    window.addEventListener("load", function () {
      video.play().catch(function () {
        screenMode = "start";

        openButton.textContent = "Запустити відео";
        openButton.hidden = false;
        openButton.classList.add("show");
      });
    });

    /* Включение и выключение музыки */
    musicButton.addEventListener("click", function () {
      if (music.paused) {
        music.play();

        musicButton.textContent = "♫";
        musicButton.classList.add("playing");
        musicButton.setAttribute(
          "aria-label",
          "Вимкнути музику"
        );
      } else {
        music.pause();

        musicButton.textContent = "♪";
        musicButton.classList.remove("playing");
        musicButton.setAttribute(
          "aria-label",
          "Увімкнути музику"
        );
      }
    });

    /* Анимация фотографий во время прокрутки */
    const photoObserver = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      },
      {
        threshold: 0.2
      }
    );

    photoSections.forEach(function (section) {
      photoObserver.observe(section);
    });
    const timelineEvents = document.querySelectorAll(".timeline-event");

const timelineTextObserver = new IntersectionObserver(
  (entries, observer) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add("timeline-visible");
        observer.unobserve(entry.target);
      }
    });
  },
  {
    threshold: 0.35
  }
);

timelineEvents.forEach((event) => {
  timelineTextObserver.observe(event);
});

/* Foto4 загружается и появляется только тогда,
   когда пользователь доходит до расписания */
const timelineSection = document.getElementById("timelineSection");

if (timelineSection) {
  const timelinePhotoObserver = new IntersectionObserver(
    function (entries, observer) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("timeline-photo-visible");
          observer.unobserve(entry.target);
        }
      });
    },
    {
      threshold: 0.12,
      rootMargin: "0px 0px -8% 0px"
    }
  );

  timelinePhotoObserver.observe(timelineSection);
}

/* Зворотний відлік до весілля — 28 листопада 2026, 11:00 у Німеччині */
const weddingDate = new Date("2026-11-28T11:00:00+01:00").getTime();
const countdownDays = document.getElementById("countdownDays");
const countdownHours = document.getElementById("countdownHours");
const countdownMinutes = document.getElementById("countdownMinutes");
const countdownSeconds = document.getElementById("countdownSeconds");

function updateCountdown() {
  const remaining = Math.max(0, weddingDate - Date.now());
  const day = 24 * 60 * 60 * 1000;
  const hour = 60 * 60 * 1000;
  const minute = 60 * 1000;

  countdownDays.textContent = Math.floor(remaining / day);
  countdownHours.textContent = String(
    Math.floor((remaining % day) / hour)
  ).padStart(2, "0");
  countdownMinutes.textContent = String(
    Math.floor((remaining % hour) / minute)
  ).padStart(2, "0");
  countdownSeconds.textContent = String(
    Math.floor((remaining % minute) / 1000)
  ).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

});
